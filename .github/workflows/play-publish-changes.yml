name: Play Publish Staged Changes

on:
  workflow_dispatch:

jobs:
  publish-staged-changes:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: tests/playwright
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/playwright/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Prepare Play auth state
        id: auth
        env:
          PLAY_STORAGE_STATE_JSON: ${{ secrets.PLAY_STORAGE_STATE_JSON }}
        run: |
          if [ -z "$PLAY_STORAGE_STATE_JSON" ]; then
            echo "::error::PLAY_STORAGE_STATE_JSON not set."
            exit 1
          fi
          PLAY_PATH="$RUNNER_TEMP/play-storage-state.json"
          printf '%s' "$PLAY_STORAGE_STATE_JSON" > "$PLAY_PATH"
          echo "play_path=$PLAY_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish staged Play Console changes
        env:
          PLAY_STORAGE_STATE_PATH: ${{ steps.auth.outputs.play_path }}
          PLAY_PUBLISH_ARTIFACT_DIR: ${{ github.workspace }}/tests/playwright/test-results/play-publish-changes
        run: node scripts/ensure-play-publish-changes.mjs

      - name: Upload Play Console artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: play-publish-changes-artifacts
          path: tests/playwright/test-results/play-publish-changes
          retention-days: 3
